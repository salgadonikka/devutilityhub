name: Deploy Backend to Azure

#on:
#  push:
#    branches: [ main ]
#    paths:
#      - 'backend/**'           # only runs when backend changes

on: workflow_dispatch # allows manual trigger from GitHub UI

env:
  APP_SERVICE_NAME: dev-utility-hub-api
  RESOURCE_GROUP: dev-utility-hub-rg

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        working-directory: backend
        run: dotnet restore

      - name: Build the project
        working-directory: backend
        run: dotnet build --configuration Release --no-restore

      - name: Run tests
        working-directory: backend/DevUtilityHub.Tests
        run: dotnet test --configuration Release --no-build --verbosity normal

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish
        working-directory: backend/DevUtilityHub.Api
        run: dotnet publish --configuration Release --runtime linux-x64 --self-contained true --output ./publish

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_SERVICE_NAME }}
          package: backend/DevUtilityHub.Api/publish
